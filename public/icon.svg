<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded corners for maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glow)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Center Graphic: Two Intersecting Energy Shields & Trophy/Star -->
  <g filter="url(#shadow)">
    <!-- Shield/Ring for Emy (Pink/Violet) -->
    <circle cx="216" cy="240" r="90" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899" stroke-width="12" />
    <!-- Shield/Ring for Youssef (Emerald/Teal) -->
    <circle cx="296" cy="240" r="90" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="12" />
    
    <!-- Central Trophy / Sparkle Icon -->
    <path d="M256 160 L266 210 L316 220 L266 230 L256 280 L246 230 L196 220 L246 210 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="4" />
    <circle cx="256" cy="220" r="8" fill="#ffffff" />

    <!-- Duo Connection Arc -->
    <path d="M190 320 Q256 370 322 320" fill="none" stroke="url(#glow)" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Title Text -->
  <text x="256" y="420" text-anchor="middle" font-family="'Outfit', 'Cairo', sans-serif" font-weight="900" font-size="46" fill="#f8fafc" letter-spacing="3">
    DUOTRACKER
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="22" fill="#34d399" letter-spacing="1">
    EMY &amp; YOUSSEF
  </text>
</svg>
