<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#181e36" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Glowing gradients for the two interlocking infinity loops / ribbons -->
    <linearGradient id="gradEmy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="gradYoussef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="coreEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Filters for deep glow and depth -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Outer Accent Ring -->
  <rect x="14" y="14" width="484" height="484" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="2" />

  <!-- Ambient Glow Behind Intersection -->
  <circle cx="190" cy="256" r="100" fill="#ec4899" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="322" cy="256" r="100" fill="#10b981" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="60" fill="#f59e0b" opacity="0.25" filter="url(#softGlow)" />

  <!-- Main Dual Wings / Mobius Energy Geometry (Symbolizing Duo Synergy & Focus) -->
  <g filter="url(#softGlow)">
    <!-- Left Wing (Emy - Rose/Violet) -->
    <path
      d="M 256 120
         C 140 120, 70 190, 70 270
         C 70 345, 130 392, 205 392
         C 260 392, 290 340, 256 256
         C 225 180, 200 160, 256 120 Z"
      fill="url(#gradEmy)"
      opacity="0.92"
    />

    <!-- Right Wing (Youssef - Emerald/Teal/Cyan) -->
    <path
      d="M 256 392
         C 372 392, 442 322, 442 242
         C 442 167, 382 120, 307 120
         C 252 120, 222 172, 256 256
         C 287 332, 312 352, 256 392 Z"
      fill="url(#gradYoussef)"
      opacity="0.92"
    />
  </g>

  <!-- Inner Dynamic Stroke Overlays (Precision Craft Lines) -->
  <!-- Emy Inner Curve Stroke -->
  <path
    d="M 94 265 C 94 200, 155 146, 256 146 C 220 180, 195 220, 215 275 C 225 305, 210 365, 175 365 C 125 365, 94 320, 94 265 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.4)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Youssef Inner Curve Stroke -->
  <path
    d="M 418 247 C 418 312, 357 366, 256 366 C 292 332, 317 292, 297 237 C 287 207, 302 147, 337 147 C 387 147, 418 192, 418 247 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.4)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Central Nexus Core: 4-Pointed Dynamic Focus Star / Diamond of Achievement -->
  <g filter="url(#coreGlow)">
    <!-- Back star flare -->
    <path
      d="M 256 176
         Q 256 256 176 256
         Q 256 256 256 336
         Q 256 256 336 256
         Q 256 256 256 176 Z"
      fill="url(#coreEnergy)"
    />

    <!-- Diagonal Accent Star -->
    <path
      d="M 256 205
         Q 256 256 205 256
         Q 256 256 256 307
         Q 256 256 307 256
         Q 256 256 256 205 Z"
      fill="#ffffff"
      opacity="0.85"
      transform="rotate(45 256 256)"
    />

    <!-- Diamond Heart -->
    <circle cx="256" cy="256" r="14" fill="#ffffff" />
    <circle cx="256" cy="256" r="7" fill="#fef08a" />
  </g>

  <!-- Delicate Focus Particle Sparks -->
  <circle cx="140" cy="180" r="4.5" fill="#f43f5e" opacity="0.9" filter="url(#coreGlow)" />
  <circle cx="372" cy="332" r="4.5" fill="#10b981" opacity="0.9" filter="url(#coreGlow)" />
  <circle cx="256" cy="90" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="256" cy="422" r="3" fill="#06b6d4" opacity="0.8" />
</svg>
